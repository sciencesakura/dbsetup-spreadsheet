name: build
on:
  pull_request:
    paths:
      - '.github/workflows/build.yaml'
      - '.java-version'
      - '.mvn/**'
      - 'config/**'
      - 'core/**'
      - 'kotlin/**'
      - 'pom.xml'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yaml'
      - '.java-version'
      - '.mvn/**'
      - 'config/**'
      - 'core/**'
      - 'kotlin/**'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version-file: .java-version
          distribution: zulu
          cache: maven
      - run: ./mvnw -e --batch-mode test -Djacoco.skip=true
