name: deploy docs
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy-docs.yaml'
      - '.java-version'
      - '.mvn/**'
      - 'core/**'
      - '!core/src/test/**'
      - 'docs/**'
      - 'kotlin/**'
      - '!kotlin/src/test/**'
      - 'pom.xml'

jobs:
  deploy-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version-file: .java-version
          distribution: zulu
          cache: maven
      - name: Generate Javadoc
        run: ./mvnw -e --batch-mode -pl core javadoc:javadoc -Dcheckstyle.skip=true -Djacoco.skip=true
      - name: Move Javadoc to docs
        run: mv -f core/target/reports/apidocs docs/
      - name: Generate Dokka
        run: ./mvnw -e --batch-mode -pl kotlin dokka:dokka
      - name: Move Dokka to docs
        run: mv -f kotlin/target/dokka docs/
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: docs
          clean: true
